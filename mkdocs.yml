site_name: QuickLook 3
site_description: Astronomical IFU Viewer
site_url: https://astrodatalab.github.io/pyql3/
repo_url: https://github.com/astrodatalab/pyql3
repo_name: astrodatalab/pyql3

theme:
  name: material
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

nav:
  - Home: index.md
  - User & Science Guide: tools.md
  - CLI & Directory Polling: cli.md
  - Developer & Testing: developer.md
  - API Reference: api.md

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [.]
          options:
            show_source: false
            show_root_heading: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/script.js
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

hooks:
  - docs/hooks.py

# `hooks.py` lives inside docs_dir, so importing it leaves a docs/__pycache__/*.pyc behind.
# Everything in docs_dir is copied verbatim into the built site, and a .pyc embeds the
# absolute path of the machine that compiled it — which then gets published by gh-deploy,
# bypassing the root .gitignore. Exclude it from the build.
exclude_docs: |
  __pycache__/
  *.pyc
