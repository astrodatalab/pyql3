name: Build and Release

on:
  push:
    tags:
      - 'v*' # Triggers workflow automatically when you push a tag like "v3.0.0"

# Least privilege by default. Only the release job needs to write, and it grants
# itself contents: write explicitly. Without this the build job would inherit the
# repository default, which is read/write on many repos -- more authority than a
# job that only compiles and uploads artifacts should hold.
permissions:
  contents: read

# Third-party actions are pinned to a commit SHA, not a floating tag. A tag like @v4
# is mutable: whoever controls the action repository can repoint it, and it would run
# in a job holding a token. The trailing comment records the human-readable version so
# the pins stay reviewable -- refresh them deliberately, not implicitly.
jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # A test that opens an unstubbed modal dialog blocks forever, and with no timeout set
    # the job runs to GitHub's six-hour default before anyone finds out. A full build is
    # well under fifteen minutes, so a hang is reported in a quarter of an hour instead.
    timeout-minutes: 45
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: QuickLook3-${{ github.ref_name }}-Linux
            archive_ext: tar.gz
          - os: windows-latest
            artifact_name: QuickLook3-${{ github.ref_name }}-Windows
            archive_ext: zip
          - os: macos-latest
            artifact_name: QuickLook3-${{ github.ref_name }}-macOS-AppleSilicon
            archive_ext: dmg
          - os: macos-15-intel
            artifact_name: QuickLook3-${{ github.ref_name }}-macOS-Intel
            archive_ext: dmg

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          enable-cache: true
          
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install Linux Qt6 System Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libglx-mesa0 libgl1-mesa-dri libxcb-cursor0 libxkbcommon-x11-0 libdbus-1-3 xvfb

      # --frozen builds from uv.lock exactly and fails if the lock is out of date,
      # so a release is reproducible from the committed lockfile.
      #
      # This previously ran `uv add --dev pyinstaller pillow` after `uv sync`, which
      # was both redundant -- pyinstaller and pillow are already in the locked dev
      # group, which plain `uv sync` installs -- and harmful: `uv add` re-resolves and
      # rewrites uv.lock, so the published binaries could be built against versions
      # nobody had reviewed.
      - name: Install dependencies
        run: uv sync --frozen

      # -n auto runs one worker per core; --dist loadfile keeps each file's tests on a
      # single worker, so the process-wide state these tests touch (the window manager,
      # the poller's watch table, the shared ConfigManager) stays within one process the
      # way a serial run gives it. Measured locally: 66 s -> 15 s on four workers, same
      # 986 passed / 6 skipped, stable across repeated runs. -q rather than -v because
      # interleaved per-test lines from four workers are not readable anyway; a failure
      # still prints in full.
      - name: Run Unit Tests (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 20
        run: xvfb-run --auto-servernum uv run pytest -q -n auto --dist loadfile
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Run Unit Tests (Non-Linux)
        if: runner.os != 'Linux'
        timeout-minutes: 20
        run: uv run pytest -q -n auto --dist loadfile

      - name: Build with PyInstaller
        run: uv run pyinstaller --noconfirm QuickLook3.spec

      - name: Verify Packaged Assets
        run: |
          uv run python -c "
          import pathlib, sys
          dist_dir = pathlib.Path('dist')
          found_lines = list(dist_dir.glob('**/*lines.txt'))
          print('Found linelist files in dist:', [str(p) for p in found_lines])
          if not found_lines:
              print('ERROR: No line list text files found in dist build artifact!')
              sys.exit(1)
          
          found_cmc = list(dist_dir.glob('**/cmcrameri*')) + list(dist_dir.glob('**/cmc*'))
          print('Found cmcrameri assets in dist:', [str(p) for p in found_cmc])
          if not found_cmc:
              print('ERROR: No cmcrameri assets found in dist build artifact!')
              sys.exit(1)

          # ds9 region support. The point of collect_all('regions') is the *compiled*
          # _geometry extensions, so match on the extension suffix -- '_geometry/*' also
          # matches the plain .py files collected alongside them (and the ones in
          # _geometry/tests/), which would let the check pass on a build with no
          # extensions in it at all. Suffix differs by platform: .pyd on Windows, .so
          # elsewhere.
          import importlib.machinery
          found_regions = [p for p in dist_dir.glob('**/regions/_geometry/*')
                           if p.suffix in importlib.machinery.EXTENSION_SUFFIXES]
          print('Found regions extensions in dist:', [str(p) for p in found_regions])
          if not found_regions:
              print('ERROR: No compiled regions/_geometry extensions found in dist build artifact!')
              sys.exit(1)
          print('ALL PACKAGED ASSETS VERIFIED SUCCESSFULLY IN DIST BUILD!')
          "

      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          cd dist
          tar -czvf ../${{ matrix.artifact_name }}.${{ matrix.archive_ext }} QuickLook3

      # 7-Zip, not Compress-Archive. A PyInstaller onedir bundle is thousands of small
      # files, which is the case Compress-Archive handles worst -- it is single-threaded
      # managed code and spends minutes on a tree 7z packs in seconds. 7-Zip is
      # preinstalled on the windows runner image. Default compression level, so the
      # download a user gets is no larger than before; the speed is from native
      # multithreaded deflate, not from compressing less.
      - name: Package Windows
        if: runner.os == 'Windows'
        run: |
          cd dist
          7z a -tzip -mmt=on ..\${{ matrix.artifact_name }}.${{ matrix.archive_ext }} QuickLook3

      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          cd dist
          hdiutil create -volname "QuickLook3" -srcfolder QuickLook3.app -ov -format UDZO ../${{ matrix.artifact_name }}.${{ matrix.archive_ext }}

      - name: Upload Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.${{ matrix.archive_ext }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts

      # The bundles are unsigned and un-notarized, so a user has no way to tell an
      # official download from a tampered one. Publishing checksums alongside them is
      # the cheapest thing that gives them something to verify against.
      # Written outside artifacts/ so the release glob below cannot match it twice.
      # Names are basenames, since download-artifact nests each one in its own
      # directory and those paths mean nothing to someone verifying a download.
      - name: Generate SHA-256 checksums
        run: |
          cd artifacts
          find . -type f -exec sha256sum {} + \
            | sed 's| \./.*/| |' \
            | sort -k2 > ../SHA256SUMS.txt
          echo "--- SHA256SUMS.txt ---"
          cat ../SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            artifacts/**/*
            SHA256SUMS.txt
          generate_release_notes: true
