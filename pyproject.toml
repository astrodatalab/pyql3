[build-system]
requires = ["setuptools>=61.0", "setuptools_scm[toml]>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyql3"
dynamic = ["version"]
description = "QuickLook 3 is a modern, high-performance Python/Qt-based application designed for viewing integral field spectroscopy data."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "astropy>=8.0.1",
    "cmcrameri>=1.9",
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "photutils>=3.0.0",
    "pydantic>=2.13.4",
    "pyopengl>=3.1.10",
    "pyqtgraph>=0.14.0",
    "pyside6>=6.6.0,<6.8.0",
    "scikit-image>=0.26.0",
    "scipy>=1.18.0",
    "watchdog>=6.0.0",
]

[dependency-groups]
dev = [
    "pillow>=12.3.0",
    "pyinstaller>=6.21.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.24.0",
    "pytest>=8.0.0",
]

[tool.uv]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'"
]

[tool.setuptools_scm]
write_to = "pyql3/_version.py"
local_scheme = "node-and-date"

[tool.setuptools]
packages = ["pyql3"]

[tool.setuptools.package-data]
"pyql3" = ["data/*", "icon.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
# Build output and the scratch script area are not ours to lint.
extend-exclude = ["dist", "build", "agent_tests", "site", "pyql3/_version.py"]
line-length = 100

[tool.ruff.lint]
# A deliberately narrow set, chosen because each rule has already caught a real
# defect in this repository rather than because it was available:
#
#   F811  a duplicate closeEvent in photometry.py silently shadowed the defensive
#         one for months, and a duplicated test name shadowed an existing test
#   F841  swallowed exception variables that discarded the error entirely
#   F401  ~35 unused imports accumulated across the GUI modules
#   E9    syntax and IO errors
#   B     flake8-bugbear; B905 in particular catches unzipped-length mismatches
#
# Widen this over time, but keep every rule justifiable -- a linter that reports
# things nobody intends to fix trains people to ignore it.
select = ["E9", "F", "B"]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately import a module purely to assert it is packaged.
"tests/test_packaging_assets.py" = ["F401"]
